    <script>
      function tT() {
        var h = document.documentElement,
          n = h.getAttribute("data-theme") === "dark" ? "light" : "dark";
        h.setAttribute("data-theme", n);
        document.getElementById("tI").innerHTML =
          n === "dark" ? "&#9788;" : "&#9790;";
        localStorage.setItem("st", n);
      }
      (function () {
        var s = localStorage.getItem("st");
        if (s) {
          document.documentElement.setAttribute("data-theme", s);
          document.getElementById("tI").innerHTML =
            s === "dark" ? "&#9788;" : "&#9790;";
        }
      })();
      function tM() {
        document.getElementById("mM").classList.toggle("on");
      }
      function cM() {
        document.getElementById("mM").classList.remove("on");
      }
    </script>
